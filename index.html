<style>
:root{--cy:#38d8ff;--bl:#1e6bff;--gold:#e8b53a;--tx:#e6f6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:#020a24;color:var(--tx);font-family:'Chakra Petch',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.wrap{max-width:560px;margin:auto;padding:10px 12px 28px;position:relative;z-index:1}
.brand{position:relative;text-align:center;padding-top:clamp(62px,18.5vw,104px);margin-bottom:2px}
.brand h1{position:relative;display:inline-block;font:400 clamp(38px,10.6vw,78px)/1.05 Bangers,Impact,sans-serif;letter-spacing:2px;transform:skewX(-8deg);padding:0 .08em;color:transparent;will-change:transform}
.brand h1 span{position:relative;z-index:1;display:inline-block;color:transparent;
 background:linear-gradient(180deg,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 36%),linear-gradient(180deg,#f2ffff 0%,#a8f0ff 14%,#4fd0ff 30%,#1c8cff 46%,#0a5cff 52%,#2a9bff 60%,#6fdcff 78%,#d8f8ff 92%,#fff 100%);
 -webkit-background-clip:text;background-clip:text}
.brand h1::before{content:attr(data-t);position:absolute;left:.08em;top:0;right:0;bottom:0;z-index:0;pointer-events:none;color:#04050a;-webkit-text-stroke:.15em #04050a;filter:drop-shadow(0 0 4px #5fd0ff) drop-shadow(0 0 14px #1e7fff);will-change:transform;
 text-shadow:0 -1.5px 0 rgba(150,185,255,.75),0 0 3px rgba(70,110,255,.55),2px 3px 0 #000}
.brand h1::after{content:attr(data-t);position:absolute;left:.08em;top:0;right:0;bottom:0;z-index:2;color:transparent;-webkit-text-stroke:0;pointer-events:none;
 background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 49%,rgba(190,240,255,.8) 53%,transparent 64%) 150% 0/260% 100% no-repeat;
 -webkit-background-clip:text;background-clip:text;animation:sw 5s ease-in-out infinite;will-change:background-position}
@keyframes sw{0%{background-position:150% 0}55%,100%{background-position:-60% 0}}
.crown{position:absolute;left:50%;top:0;width:clamp(78px,24vw,132px);transform:translateX(-50%) rotate(-4deg);z-index:2;overflow:visible;filter:drop-shadow(0 0 8px #3aa8ff) drop-shadow(0 0 22px #1e6bff) drop-shadow(0 4px 4px rgba(0,10,60,.7));animation:cf 3.6s ease-in-out infinite}
@keyframes cf{50%{transform:translateX(-50%) translateY(-3px) rotate(-2deg)}}
.crown .gl{fill:#fff}
.spk{position:absolute;width:clamp(12px,3.6vw,20px);aspect-ratio:1;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 4px #7fe3ff);opacity:0;animation:tw 2.8s ease-in-out infinite;z-index:3;pointer-events:none}
.stage{position:relative;aspect-ratio:1.4/1;margin-top:4px}
.wheel{position:absolute;right:1%;top:6%;width:58%;aspect-ratio:1}
.ring{position:absolute;inset:0;border-radius:50%;padding:5%;background:conic-gradient(#f2c14e,#a8741a,#f2c14e,#8a5d0b,#f2c14e);box-shadow:0 0 28px #1d7cff,0 0 50px #0a4fe0}
@keyframes gl{50%{box-shadow:0 0 44px #3aa0ff,0 0 100px #1060ff}}
.face{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 22px #000}.face::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;background:repeating-radial-gradient(circle,rgba(160,215,255,.07) 0 1px,transparent 1px 6px),radial-gradient(circle at 30% 22%,rgba(190,235,255,.4),transparent 42%),radial-gradient(circle at 75% 85%,rgba(60,140,255,.25),transparent 40%)}
.face canvas{width:100%;height:100%;display:block;will-change:transform}
.led{position:absolute;width:2.6%;aspect-ratio:1;border-radius:50%;background:#c8f1ff;box-shadow:0 0 10px 3px #2ab4ff;transform:translate(-50%,-50%);animation:ld 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*.1s)}
.ptr{position:absolute;left:50%;top:-4%;width:13%;aspect-ratio:1;transform:translateX(-50%);background:linear-gradient(#f6d060,#b27a17);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 0 8px #2aa8ff);z-index:3}
.coin{position:absolute;left:50%;top:50%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe596,#c58f1d 60%,#8a5d0b);box-shadow:0 0 18px #2a9bff,inset 0 0 8px #5a3a05;display:grid;place-items:center;color:#3a2606;font-size:clamp(14px,5vw,26px);z-index:2}
.dino{position:absolute;left:-3%;top:2%;width:47%;aspect-ratio:470/388;z-index:4;pointer-events:none;transform-origin:30% 95%;animation:lunge 7s ease-in-out infinite}
.dino img{width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent);filter:drop-shadow(0 0 12px #2aa0ff);transform-origin:35% 95%;animation:bob 2.4s ease-in-out infinite}

.dino.roar img{animation:roar 1.5s ease-out}
@keyframes roar{0%{transform:none}10%{transform:scale(1.17) rotate(-3deg)}18%{transform:scale(1.17) translateX(-2%)}26%{transform:scale(1.17) translateX(2%)}34%{transform:scale(1.15) translateX(-1.5%)}42%{transform:scale(1.15) translateX(1.5%)}100%{transform:none}}
.gift{position:absolute;left:13%;bottom:3%;width:17%;z-index:5;filter:drop-shadow(0 0 10px #38d8ff);animation:wg 3s ease-in-out infinite}
@keyframes wg{0%,70%,100%{transform:none}78%{transform:rotate(-6deg)}86%{transform:rotate(6deg)}94%{transform:rotate(-3deg)}}
.gs{display:block;width:100%;overflow:visible}
.lid{transform-box:fill-box;transform-origin:20% 100%}
.go{display:block;width:100%;margin:8px 0 12px;padding:8px 10px 4px;border:3px solid var(--gold);border-radius:18px;background:linear-gradient(#0d46c4,#06205f);color:#fff;font:400 clamp(40px,12vw,62px)/1 Bangers,Impact,sans-serif;letter-spacing:3px;transform:skewX(-6deg);text-shadow:0 0 8px #7fdcff,0 0 22px #1e8fff;box-shadow:0 0 24px #1e6bff,inset 0 0 22px rgba(80,180,255,.45);cursor:pointer}
.go:active{filter:brightness(1.3)}.go:disabled{opacity:.6;cursor:wait}
.panel{border:1.5px solid #1b6dff;border-radius:14px;background:rgba(3,14,40,.88);padding:12px;margin-bottom:10px;box-shadow:0 0 18px rgba(30,107,255,.45),inset 0 0 18px rgba(30,107,255,.15)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:700;font-size:20px;color:var(--cy)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row.nw{flex-wrap:nowrap}
.chip,.sm{border:1.5px solid var(--bl);border-radius:99px;padding:8px 14px;background:#041436;color:var(--cy);font:inherit;cursor:pointer}
.chip.on,.sm.on{border-color:var(--gold);color:#ffd36a;box-shadow:0 0 10px rgba(232,181,58,.5)}
.in{flex:1;min-width:0;background:#030d27;border:1.5px solid #174aa8;border-radius:12px;color:var(--tx);padding:11px 12px;font:inherit}
.in.q{flex:0 0 74px}
.btn{border:0;border-radius:12px;padding:0 16px;min-height:44px;background:linear-gradient(#4be6ff,#12a6f0);color:#04204a;font:inherit;font-weight:700;cursor:pointer}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pc{display:inline-flex;align-items:center;gap:6px;background:#06204f;border:1px solid #1e6bff;border-radius:99px;padding:4px 6px 4px 12px;font-size:14px}
.pc button{border:0;background:none;color:#7fb8ff;font-size:14px;cursor:pointer;padding:2px 6px}
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(2,8,30,.85);backdrop-filter:blur(6px);z-index:20;text-align:center;padding:20px}
.ov.on{display:grid}
.card{display:flex;flex-direction:column;align-items:center;gap:6px}
.lb{font:400 26px Bangers,Impact,sans-serif;letter-spacing:3px;color:var(--gold);text-shadow:0 0 12px #e8b53a}

.ov.on .nm{animation:rise .8s .25s cubic-bezier(.2,1.4,.4,1) forwards}

.pz{color:var(--cy);font-size:18px;opacity:0}.ov.on .pz{animation:rise .6s .8s forwards}

.beam{pointer-events:none;position:absolute;left:50%;top:44%;width:230%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(110,210,255,.7),rgba(30,120,255,.25) 40%,transparent 68%);opacity:0}

.vg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,transparent 35%,rgba(0,0,10,.45) 100%)}
.cr{position:absolute;height:auto;aspect-ratio:100/120;filter:drop-shadow(0 0 10px #4fc8ff) saturate(1.25);animation:sh 4s ease-in-out infinite}
.stage .cr{z-index:3}
@keyframes sh{50%{opacity:.86}}.gl2{animation-delay:-1.2s}.gl3{animation-delay:-.6s}
.ledge{position:absolute;left:28%;right:-4%;bottom:-2%;height:13%;background:linear-gradient(#0d2a70,#030a22);clip-path:polygon(0 50%,7% 15%,18% 40%,33% 5%,52% 35%,70% 10%,88% 38%,100% 20%,100% 100%,0 100%)}
.dt{position:absolute;width:3px;height:3px;border-radius:50%;background:#bdeeff;box-shadow:0 0 8px 2px #2ab4ff;animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:1;transform:translateY(-34px)}}
.ring::before{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(transparent 0 80%,rgba(255,255,255,.6) 90%,transparent 100%);animation:rt 6s linear infinite;will-change:transform}
@keyframes rt{to{transform:rotate(360deg)}}
.spin .ring::before{animation-duration:1.1s}
@keyframes ld{50%{opacity:.3}}
.spin .led{animation-duration:.3s}
.gl{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.sp{pointer-events:none;position:absolute;left:50%;top:44%;width:6px;height:6px;border-radius:50%;background:#e4f9ff;box-shadow:0 0 10px 3px #38d8ff;opacity:0}
.ov.on .sp{animation:up 1.8s infinite}
@keyframes up{0%{opacity:0;transform:none}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),-150px)}}
.typing *,.typing *::before{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

.cr{will-change:opacity}
.dino,.dino img,.gift,.crown{will-change:transform}
.led,.dt,.spk{will-change:opacity,transform}
.brand h1 span{will-change:transform}
.typing *,.typing *::before,.typing *::after{animation-play-state:paused!important}
.panel{contain:layout style}

/* ===== PREMIUM ===== */
.panel{border:1.5px solid transparent;background:linear-gradient(160deg,rgba(9,34,92,.82),rgba(2,10,36,.93)) padding-box,linear-gradient(135deg,#bff3ff,#2a8cff 28%,#0a2f9f 55%,#38d8ff 80%,#e8fbff) border-box;box-shadow:0 0 20px rgba(30,107,255,.42),0 10px 24px rgba(0,5,30,.55),inset 0 1px 0 rgba(160,225,255,.25),inset 0 0 22px rgba(30,107,255,.14)}
.hd{letter-spacing:.6px;text-shadow:0 0 12px rgba(56,216,255,.55)}
.chip,.sm,.btn{transition:transform .12s,box-shadow .2s,filter .2s}
.chip:active,.sm:active,.btn:active{transform:scale(.95)}
.chip{background:linear-gradient(#08265f,#041436)}
.chip.on,.sm.on{background:linear-gradient(#0d3a8c,#061d52);box-shadow:0 0 12px rgba(232,181,58,.55),inset 0 1px 0 rgba(255,225,140,.35)}
.btn{background:linear-gradient(#8ff0ff,#2cc2ff 45%,#0f7fe0 55%,#34b4ff);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 4px 14px rgba(30,140,255,.5)}
.btn.alt{background:linear-gradient(#0d3a8c,#061d52);color:var(--cy);border:1.5px solid var(--bl);box-shadow:none}
.in{background:linear-gradient(#020a22,#041433);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.in:focus{outline:none;border-color:var(--cy);box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 0 0 3px rgba(56,216,255,.2),0 0 14px rgba(56,216,255,.35)}
.pc{background:linear-gradient(#0a2c70,#051a45);box-shadow:inset 0 1px 0 rgba(160,225,255,.25)}
.go{position:relative;overflow:visible;background:linear-gradient(#2a86ff,#0d46c4 48%,#06205f 52%,#0b3aa8);transition:transform .12s,filter .2s}
.go:active{transform:skewX(-6deg) scale(.97)}
.go::before{content:'';position:absolute;left:4%;right:4%;top:5%;height:42%;border-radius:14px 14px 50% 50%;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.go::after{content:'';position:absolute;inset:-5px;border-radius:22px;box-shadow:0 0 30px 6px #2aa0ff;opacity:.35;animation:gp 2.6s ease-in-out infinite;pointer-events:none;will-change:opacity}
.go:disabled::after{animation:none;opacity:.15}
@keyframes gp{50%{opacity:.8}}
